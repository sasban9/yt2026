<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderlust — A Journey Through the World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400&family=Playfair+Display:ital,wght@0,400;1,400;1,700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c9a96e;--gold-light:#e8d5a8;--cream:#f5f0e8;
  --dark:#0a0908;--dark2:#14120f;--muted:rgba(255,255,255,0.35);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--dark);color:var(--cream);cursor:none}

/* cursor */
#cursor{position:fixed;z-index:9999;width:10px;height:10px;border:1px solid var(--gold);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s}
#cursor.expand{width:34px;height:34px;background:rgba(201,169,110,.12)}

/* ── BACKGROUND MOSAIC WALL ── */
#bg-wall{
  position:fixed;inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
#bg-canvas{
  position:absolute;
  left:500px;top:0;
  width:100%;
  /* height set by JS */
  will-change:transform;
  /* NO css transition here — JS drives it via requestAnimationFrame for smoothness */
}
.photo-tile{
  position:absolute;
  overflow:hidden;
  border-radius:2px;
}
.photo-tile-inner{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:var(--dark2);
  font-family:'Josefin Sans',sans-serif;
  font-weight:100;font-size:10px;letter-spacing:.28em;
  text-transform:uppercase;color:rgba(245,240,232,.22);
  flex-direction:column;gap:10px;
}
.photo-tile-inner svg{
  width:36px;height:36px;fill:none;
  stroke:rgba(245,240,232,.18);stroke-width:.8;
}
.photo-tile img{
  width:100%;height:100%;object-fit:cover;
  display:block;
  filter:brightness(.48) saturate(.75);
}

/* dark overlay on bg */
#bg-wall::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  /* background:rgba(10,9,8,0); */
}

/* ── FOREGROUND SLIDES ── */
#fg-wrap{
  position:fixed;inset:0;z-index:10;overflow:hidden;
  pointer-events:none;
}
#fg-track{
  position:absolute;left:0;top:0;width:100%;
  will-change:transform;
  transition:transform 1.3s cubic-bezier(.77,0,.175,1);
}
.slide{
  width:100%;height:100vh;
  display:flex;align-items:center;justify-content:flex-start;
  padding:0 8vw;pointer-events:none;
}
.slide-content{max-width:960px;position:relative;background: #0009;padding: 3rem;}

.slide-meta{display:flex;align-items:center;gap:14px;margin-bottom:26px;opacity:0;transform:translateY(16px);transition:opacity .8s .18s ease,transform .8s .18s ease}
.slide-chapter{font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:16px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
.slide-divider-line{width:36px;height:1px;background:var(--gold);opacity:.5}
.slide-number{font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:16px;letter-spacing:.2em;color:var(--muted)}

.slide-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(3rem,6.8vw,6rem);line-height:1.04;color:var(--cream);margin-bottom:10px;opacity:0;transform:translateY(22px);transition:opacity .9s .33s ease,transform .9s .33s ease}
.slide-title em{font-style:italic;font-weight:300;color:var(--gold-light)}

.slide-subtitle{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:clamp(1rem,2vw,1.4rem);color:var(--gold);margin-bottom:22px;opacity:0;transform:translateY(18px);transition:opacity .8s .5s ease,transform .8s .5s ease}

.slide-rule{display:flex;align-items:center;gap:10px;margin-bottom:22px;opacity:0;transition:opacity .8s .58s ease}
.slide-rule::before,.slide-rule::after{content:'';flex:0 0 28px;height:1px;background:var(--gold);opacity:.4}
.slide-rule-diamond{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);opacity:.7}

.slide-body{font-family:'Josefin Sans',sans-serif;font-weight:300;font-size:clamp(1rem,1.25vw,2rem);letter-spacing:.07em;line-height:1.88;color:rgba(245,240,232,.62);min-width:460px;margin-bottom:28px;opacity:0;transform:translateY(12px);transition:opacity .8s .7s ease,transform .8s .7s ease}

.slide-tags{display:flex;gap:9px;flex-wrap:wrap;opacity:0;transform:translateY(8px);transition:opacity .7s .86s ease,transform .7s .86s ease}
.slide-tag{font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,169,110,.28);padding:5px 11px}

.slide.active .slide-meta,.slide.active .slide-title,.slide.active .slide-subtitle,
.slide.active .slide-rule,.slide.active .slide-body,.slide.active .slide-tags{opacity:1;transform:translateY(0)}

/* ── UI CHROME ── */
#progress-bar{position:fixed;bottom:0;left:0;height:2px;background:var(--gold);width:0%;z-index:100;transition:width 1.2s cubic-bezier(.77,0,.175,1);box-shadow:0 0 8px rgba(201,169,110,.4)}

#slide-counter{position:fixed;bottom:26px;right:36px;z-index:100;font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:11px;letter-spacing:.24em;color:var(--muted);display:flex;align-items:center;gap:8px}
#slide-counter .cur{font-weight:300;color:var(--gold);font-size:14px}

.nav-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:200;background:none;border:none;cursor:none;padding:16px;display:flex;align-items:center;justify-content:center}
.nav-btn:disabled{opacity:.15;pointer-events:none}
#nav-prev{left:24px}
#nav-next{right:24px}
.nav-btn svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1;transition:stroke .2s,transform .2s}
.nav-btn:hover svg{stroke:var(--gold-light);transform:scale(1.15)}

#site-title{position:fixed;top:26px;left:40px;z-index:100;font-family:'IM Fell English',serif;font-size:18px;letter-spacing:.08em;color:var(--gold);opacity:.85}
#site-title span{font-style:italic;font-size:11px;font-family:'Josefin Sans',sans-serif;font-weight:100;letter-spacing:.38em;text-transform:uppercase;color:var(--muted);display:block;margin-top:2px}

#slide-dots{position:fixed;right:34px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:7px;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:rgba(201,169,110,.22);transition:background .4s,transform .4s;cursor:pointer}
.dot.active{background:var(--gold);transform:scale(1.6)}

#hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:16px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);opacity:1;transition:opacity 1s;z-index:100}
#hint.hidden{opacity:0;pointer-events:none}

#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
background:radial-gradient(ellipse at center,#0000, #fff0,#000)}
</style>
</head>

  {ch:"Prologue",     title:"The World <em>Awaits</em>",         sub:"Begin where the road loses itself",          body:"Every journey starts with a single breath — a moment of stillness before the world opens up. Pack light, dream heavy, and let the horizon be your compass.",                                                           tags:["Wanderlust","Origin","First Step"]},
  {ch:"Chapter I",   title:"Lost in <em>Patagonia</em>",         sub:"Where the wind writes the maps",             body:"The Torres del Paine rise like cathedral spires from the Patagonian steppe. Here, weather changes faster than your plans, and the land demands full surrender.",                                                   tags:["Patagonia","Hiking","Wilderness"]},
  {ch:"Chapter I",   title:"Across the <em>Andes</em>",          sub:"High roads and lower expectations",          body:"Altitude strips away pretense. At 4,000 metres the air thins, the ego dissolves, and what remains is pure presence on ancient stone paths once walked by the Inca.",                                               tags:["Andes","Altitude","Inca Trail"]},
  {ch:"Chapter I",   title:"<em>Tierra</em> del Fuego",          sub:"The uttermost part of the earth",            body:"Ushuaia sits at the end of everything. Glaciers calve into cold grey channels, and the sky performs a slow drama of cloud, light, and absolute silence.",                                                         tags:["Ushuaia","Glaciers","Solitude"]},
  {ch:"Chapter II",  title:"The <em>Sahara</em> Speaks",         sub:"A thousand miles of golden silence",         body:"Before dawn the desert holds its breath. Then light arrives and the dunes ignite — amber, copper, rose — each grain a million years in the making.",                                                              tags:["Sahara","Desert","Sand Dunes"]},
  {ch:"Chapter II",  title:"Nights in <em>Marrakech</em>",       sub:"Where spice and colour collide",             body:"The Djemaa el-Fna transforms at dusk. Snake charmers, storytellers, and smoke from a hundred braziers conspire to make time irrelevant in the best possible way.",                                              tags:["Morocco","Medina","Night Market"]},
  {ch:"Chapter II",  title:"<em>Wadi Rum</em>",                  sub:"Mars on Earth",                              body:"Lawrence called it vast, echoing, god-like. Red sandstone towers soar from silence, and Bedouin fires at night make the Milky Way feel close enough to touch.",                                                  tags:["Jordan","Desert","Stargazing"]},
  {ch:"Chapter III", title:"Dawn over <em>Varanasi</em>",        sub:"Where every sunrise is a prayer",            body:"The Ganges carries everything: ash, marigolds, laughter, grief. To watch the morning aarti from a wooden boat is to feel time fold back on itself into something eternal.",                                    tags:["India","Ganges","Spirituality"]},
  {ch:"Chapter III", title:"Tea Gardens of <em>Darjeeling</em>", sub:"A mist that tastes of bergamot",             body:"Rows of tea bushes climb steep hillsides like green contour lines. The Himalayas, when they reveal themselves through cloud, look like a rumour you finally believe.",                                           tags:["Darjeeling","Tea","Himalayas"]},
  {ch:"Chapter III", title:"<em>Kyoto</em> in Autumn",           sub:"Red leaves and slow afternoons",             body:"Maple trees in Arashiyama turn the light blood-orange. The temples ask for silence; the raked gravel gardens ask for patience. Both offer a rare and quiet reward.",                                             tags:["Japan","Autumn","Temples"]},
  {ch:"Chapter IV",  title:"Islands of <em>Faroe</em>",          sub:"Clouds that live inside the mountains",      body:"The Faroe Islands refuse to be photographed honestly. Waterfalls fall into the Atlantic from impossible cliffs, and the green is a colour that has no name in English.",                                      tags:["Faroe Islands","Nordic","Cliffs"]},
  {ch:"Chapter IV",  title:"<em>Iceland</em> in January",        sub:"Fire, ice, and the northern lights",         body:"The aurora borealis appears without announcement, a curtain of green and violet pulled across a black sky. You stand in the cold and understand why ancients built gods.",                                       tags:["Iceland","Aurora","Winter"]},
  {ch:"Chapter IV",  title:"Scottish <em>Highlands</em>",        sub:"Moorland, mist, and melancholy beauty",      body:"The glens hold weather like memory. Every loch reflects a different sky, every stone wall tells of hands that placed it carefully, long before you arrived to admire it.",                                   tags:["Scotland","Highlands","Moors"]},
  {ch:"Chapter V",   title:"Amazon <em>Awakening</em>",          sub:"The lungs of the earth breathe loudly",      body:"Before 5am the jungle announces itself: frogs, birds, something enormous moving through dark water. The biodiversity is not a fact here — it is a presence, pressing in on all sides.",                     tags:["Amazon","Rainforest","Biodiversity"]},
  {ch:"Chapter V",   title:"Galápagos <em>Drift</em>",           sub:"Where evolution is still happening",         body:"Blue-footed boobies perform their absurd courtship dance. Marine iguanas sneeze salt into the wind. On these islands the distance between us and our origins is almost nothing.",                             tags:["Galápagos","Wildlife","Evolution"]},
  {ch:"Chapter V",   title:"The <em>Pantanal</em>",              sub:"The world's greatest wetland",               body:"Jaguars hunt capybara on river banks lit by afternoon gold. This is the largest tropical wetland on earth — a place where water and life have negotiated a perfect arrangement.",                            tags:["Pantanal","Jaguar","Wetlands"]},
  {ch:"Chapter VI",  title:"Crossing the <em>Gobi</em>",         sub:"Empty roads into deeper quiet",              body:"The Gobi asks only that you endure. Endless gravel plains, dust devils, and then — improbably — a field of sand dunes that glow orange at the end of a long, relentless day.",                            tags:["Gobi","Mongolia","Desert Road"]},
  {ch:"Chapter VI",  title:"<em>Tbilisi</em> at Midnight",       sub:"Ancient city, warm bread, cold wine",        body:"Georgian wine is poured into clay vessels buried underground for thousands of years. The old town of Tbilisi is carved into a cliff, and the people stay awake long after tourists sleep.",                tags:["Georgia","Caucasus","Wine"]},
  {ch:"Chapter VI",  title:"The <em>Silk Road</em>",             sub:"Trading in stories, not just silk",          body:"Samarkand's Registan was once the crossroads of the known world. The tilework still shimmers blue-green in the morning sun, a testament to beauty as a form of ambition.",                                 tags:["Uzbekistan","Silk Road","History"]},
  {ch:"Chapter VII", title:"<em>Namib</em> Desert Coast",        sub:"Where dunes meet the cold Atlantic",         body:"Sossusvlei at sunrise: dunes cast shadows five times their height. Dead camelthorn trees stand in a white clay pan, perfectly preserved, silhouettes against a burning orange world.",                     tags:["Namibia","Dunes","Sossusvlei"]},
  {ch:"Chapter VII", title:"Gorilla Trek in <em>Bwindi</em>",    sub:"A meeting you won't forget",                 body:"After three hours climbing through dense jungle you find them — a family at rest, entirely unbothered by your presence. The silverback glances at you once. That is enough.",                                  tags:["Uganda","Gorillas","Jungle Trek"]},
  {ch:"Chapter VII", title:"<em>Zanzibar</em> Stone Town",       sub:"Carved doors and ocean air",                 body:"The alleyways of Stone Town are a maze of carved wooden doors, each one a century of ornate craftsmanship. The call to prayer and the smell of cloves drift through the same warm air.",                  tags:["Zanzibar","Tanzania","Stone Town"]},

// ── Build mosaic ──────────────────────────────────────────────────────────────
// Seeded pseudo-random for reproducible layout
function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
const rng = seededRand(42);

const bgCanvas = document.getElementById('bg-canvas');
const VW = window.innerWidth;
const VH = window.innerHeight;

// Decide mosaic total height: bg needs to cover foreground travel of (TOTAL-1)*VH
// fg travels (TOTAL-1)*100vh; bg at PARALLAX ratio travels (TOTAL-1)*100vh*PARALLAX
// So bgCanvas height = VH + (TOTAL-1)*VH*PARALLAX + some buffer
const bgTotalH = VH + (TOTAL - 1) * VH * PARALLAX + VH * 0.5;
bgCanvas.style.height = bgTotalH + 'px';

// Place 100 tiles in a loose pack
const tiles = [];
const COLS = 4; // conceptual columns to loosely align
const colW = VW / COLS;
const colTops = [0, 0, 0, 0]; // track column fill height

// size buckets: landscape-wide, landscape-medium, portrait, square-ish
const sizeBuckets = [
  {wMin:.22,wMax:.38,hMin:.28,hMax:.55}, // landscape wide
  {wMin:.18,wMax:.30,hMin:.35,hMax:.70}, // portrait
  {wMin:.16,wMax:.28,hMin:.20,hMax:.38}, // small landscape
  {wMin:.20,wMax:.32,hMin:.20,hMax:.35}, // squarish
];

for (let i = 0; i < 100; i++) {
  const bucket = sizeBuckets[Math.floor(rng() * sizeBuckets.length)];
  const w = (bucket.wMin + rng() * (bucket.wMax - bucket.wMin)) * VW;
  const h = (bucket.hMin + rng() * (bucket.hMax - bucket.hMin)) * VH;

  // Pick the least-filled column, with slight random variation
  let col = 0;
  let minTop = Infinity;
  for (let c = 0; c < COLS; c++) {
    const jitter = rng() * VH * 0.12;
    if (colTops[c] + jitter < minTop) { minTop = colTops[c] + jitter; col = c; }
  }

  // x: within that column, small random offset
  const colStart = col * colW;
  const xOffset = (rng() - 0.5) * colW * 0.3;
  const x = Math.max(8, Math.min(VW - w - 8, colStart + (colW - w) * 0.5 + xOffset));

  // y: at column top with small gap
  const gap = 10 + rng() * 20;
  const y = colTops[col] + gap;

  colTops[col] = y + h + gap;
  tiles.push({x, y, w, h, idx: i});
}

tiles.forEach(({x, y, w, h, idx}) => {
  const tile = document.createElement('div');
  tile.className = 'photo-tile';
  tile.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  const url = IMG_URLS[idx];
  tile.innerHTML = `<img src="${url}" alt="${LOCATIONS[idx]}" loading="lazy">`;
  bgCanvas.appendChild(tile);
});

// ── Foreground slides ─────────────────────────────────────────────────────────
const fgTrack = document.getElementById('fg-track');
fgTrack.style.height = (TOTAL * 100) + 'vh';

const dotsEl = document.getElementById('slide-dots');
SLIDES.forEach((d, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' active' : '');
  slide.style.top = (i * 100) + 'vh';
  slide.innerHTML = `
    <div class="slide-content">
      <div class="slide-meta">
        <span class="slide-chapter">${d.ch}</span>
        <span class="slide-divider-line"></span>
        <span class="slide-number">${String(i+1).padStart(2,'0')} / 25</span>
      </div>
      <h2 class="slide-title">${d.title}</h2>
      <p class="slide-subtitle">${d.sub}</p>
      <div class="slide-rule"><div class="slide-rule-diamond"></div></div>
      <p class="slide-body">${d.body}</p>
      <div class="slide-tags">${d.tags.map(t=>`<span class="slide-tag">${t}</span>`).join('')}</div>
    </div>`;
  fgTrack.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.title = d.ch;
  dot.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(dot);
});

const slideEls = document.querySelectorAll('.slide');
const dotEls   = document.querySelectorAll('.dot');

// ── Smooth bg scrolling via rAF ───────────────────────────────────────────────
let current    = 0;
let isAnimating = false;

// Animated bg position
let bgCurrentY  = 0; // actual rendered Y offset (px, negative = scrolled up)
let bgTargetY   = 0; // where we want to be

function lerp(a, b, t) { return a + (b - a) * t; }

let rafId = null;
function animateBg() {
  const diff = bgTargetY - bgCurrentY;
  if (Math.abs(diff) < 0.05) {
    bgCurrentY = bgTargetY;
    bgCanvas.style.transform = `translateY(${bgCurrentY}px)`;
    rafId = null;
    return;
  }
  bgCurrentY = lerp(bgCurrentY, bgTargetY, 0.07);
  bgCanvas.style.transform = `translateY(${bgCurrentY}px)`;
  rafId = requestAnimationFrame(animateBg);
}

function goTo(idx) {
  if (isAnimating || idx === current || idx < 0 || idx >= TOTAL) return;
  isAnimating = true;

  slideEls[current].classList.remove('active');
  dotEls[current].classList.remove('active');
  current = idx;

  // FG: jump via CSS transition
  fgTrack.style.transform = `translateY(-${current * 100}vh)`;

  // BG: target = fg scroll distance × PARALLAX
  bgTargetY = -(current * VH * PARALLAX);
  if (!rafId) rafId = requestAnimationFrame(animateBg);

  slideEls[current].classList.add('active');
  dotEls[current].classList.add('active');
  document.getElementById('cc').textContent = String(current+1).padStart(2,'0');
  document.getElementById('progress-bar').style.width = ((current+1)/TOTAL*100)+'%';
  document.getElementById('nav-prev').disabled = current === 0;
  document.getElementById('nav-next').disabled = current === TOTAL - 1;
  document.getElementById('hint').classList.add('hidden');

  setTimeout(() => { isAnimating = false; }, 1350);
}

document.getElementById('nav-prev').addEventListener('click', () => goTo(current-1));
document.getElementById('nav-next').addEventListener('click', () => goTo(current+1));
document.addEventListener('keydown', e => {
  if (e.key==='ArrowDown'||e.key==='ArrowRight') goTo(current+1);
  if (e.key==='ArrowUp'||e.key==='ArrowLeft')    goTo(current-1);
});

let touchStartY = 0;
document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 40) goTo(dy > 0 ? current+1 : current-1);
}, {passive:true});

let wheelCooldown = false;
document.addEventListener('wheel', e => {
  if (wheelCooldown) return;
  wheelCooldown = true;
  goTo(e.deltaY > 0 ? current+1 : current-1);
  setTimeout(() => { wheelCooldown = false; }, 1500);
}, {passive:true});

// cursor
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX+'px';
  cursorEl.style.top  = e.clientY+'px';
});
document.querySelectorAll('button,.dot').forEach(el => {
  el.addEventListener('mouseenter', () => cursorEl.classList.add('expand'));
  el.addEventListener('mouseleave', () => cursorEl.classList.remove('expand'));
});

// init state
document.getElementById('nav-prev').disabled = true;
document.getElementById('progress-bar').style.width = (1/TOTAL*100)+'%';
bgCanvas.style.transform = 'translateY(0px)';
</script>
</body>
</html>
